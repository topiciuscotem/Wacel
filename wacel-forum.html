<div id="comments-modal" class="modal">
  <div class="modal-box">

      <h3 id="modal-title" style="font-weight:900">التعليقات</h3>

    </div>

<script type="module">
import { initializeApp } from 'firebase/app';
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc, increment, getDocs } from 'firebase/firestore';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
import firebaseConfig from './wacel-firebase-config.js';

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let currentTopicId = null;
let points = parseInt(localStorage.getItem('wacel_points')||'0');
document.getElementById('points-badge').textContent = points + ' نقطة';

onAuthStateChanged(auth, async (user)=>{
  if(!user){ await signInAnonymously(auth); return; }
  currentUser = user;
  document.getElementById('user-info').textContent = '👤 زائر #' + user.uid.slice(0,5);
  loadTopics();
});

async function loadTopics(){
  const q = query(collection(db,'forum'), orderBy('createdAt','desc'));
  onSnapshot(q, (snap)=>{
    const list = document.getElementById('topics-list');
    list.innerHTML = '';
    snap.forEach(docSnap=>{
      const data = docSnap.data();
      const div = document.createElement('div');
      div.className='topic-card';
      div.innerHTML=`
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="display:flex;gap:10px;align-items:center">
            <div class="avatar">${data.category[0]}</div>
            <div><b style="font-size:14px">${data.title}</b><br><span style="font-size:11px;color:var(--muted)">${data.category} • ${data.author?.slice(0,5)} • ${data.createdAt?.toDate ? data.createdAt.toDate().toLocaleDateString('ar-MA') : 'الآن'}</span></div>
          </div>
          <div style="text-align:center"><div style="background:var(--ad-bg);padding:4px 10px;border-radius:20px;font-size:11px">💬 ${data.comments||0}</div><div style="font-size:11px;margin-top:4px">👍 ${data.likes||0}</div></div>
        </div>`;
      div.onclick=()=>openComments(docSnap.id, data.title);
      list.appendChild(div);
    });
    if(snap.empty) list.innerHTML='<p style="text-align:center;padding:30px;color:var(--muted)">لا يوجد مواضيع بعد - كن أول من ينشر واربح 10 نقاط!</p>';
  });
}

document.getElementById('new-topic-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!currentUser) return alert('انتظر تسجيل الدخول');
  const title = document.getElementById('topic-title').value;
  const content = document.getElementById('topic-content').value;
  const category = document.getElementById('topic-category').value;
  await addDoc(collection(db,'forum'),{
    title, content, category,
    author: currentUser.uid,
    likes:0, comments:0,
    createdAt: serverTimestamp()
  });
  e.target.reset();
  points+=10; localStorage.setItem('wacel_points', points);
  document.getElementById('points-badge').textContent = points+' نقطة';
  alert('✅ تم النشر! +10 نقاط');
});

function openComments(id, title){
  currentTopicId=id;
  document.getElementById('modal-title').textContent=title;
  document.getElementById('comments-modal').classList.add('active');
  const q = query(collection(db,'comments'), orderBy('createdAt','asc'));
  // فلترة بسيطة فالواجهة (للتبسيط)
  onSnapshot(q, snap=>{
    const list=document.getElementById('comments-list');
    list.innerHTML='';
    snap.forEach(d=>{
      if(d.data().topicId===id){
        const c=d.data();
        const div=document.createElement('div');
        div.style.cssText='padding:10px;border-bottom:1px solid var(--border);font-size:13px';
        div.innerHTML=`<b style="font-size:11px;color:var(--primary)">${c.author.slice(0,5)}</b>: ${c.text}`;
        list.appendChild(div);
      }
    });
  });
}

document.getElementById('comment-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const text=document.getElementById('comment-input').value;
  if(!text) return;
  await addDoc(collection(db,'comments'),{topicId:currentTopicId, text, author:currentUser.uid, createdAt:serverTimestamp()});
  // زيادة عداد التعليقات
  const topicRef = doc(db,'forum',currentTopicId);
  await updateDoc(topicRef,{comments:increment(1)});
  document.getElementById('comment-input').value='';
  points+=5; localStorage.setItem('wacel_points',points);
